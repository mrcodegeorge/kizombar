<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline — Kizo SOP Manager</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif;
            background: #f5f5f5;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 2rem;
            text-align: center;
        }
        .icon { font-size: 5rem; margin-bottom: 1.5rem; }
        h1 { font-size: 1.75rem; font-weight: 800; color: #111; margin-bottom: 0.75rem; }
        p { color: #6b7280; font-size: 1rem; line-height: 1.6; max-width: 280px; margin-bottom: 2rem; }
        .btn {
            background: #1a6b3c;
            color: white;
            border: none;
            padding: 0.875rem 2rem;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }
    </style>
</head>
<body>
    <div class="icon">📡</div>
    <h1>You're Offline</h1>
    <p>No internet connection detected. Please check your network and try again.</p>
    <a href="javascript:window.location.reload()" class="btn">Try Again</a>
</body>
</html>
